<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OLED Dashboard v2</title><style>body{font:16px system-ui;background:#f4f6f8;color:#172331;max-width:760px;margin:45px auto;padding:0 20px}section{background:white;border:1px solid #dce1e7;border-radius:12px;padding:24px;margin:16px 0}button,input{font:inherit}button{background:#165eac;color:white;border:0;border-radius:7px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.4}canvas{width:100%;max-width:512px;image-rendering:pixelated;background:black;display:block;margin:16px auto;border:8px solid #25313e;border-radius:8px;box-sizing:border-box}pre{white-space:pre-wrap;background:#101923;color:#b5efc8;padding:14px;max-height:200px;overflow:auto}label{display:block;margin:14px 0}small{color:#526273}</style></head><body><h1>OLED Dashboard <small>v2</small></h1><p>Upload an image, preview the 128 × 64 monochrome result and send it directly to your ESP32.</p><section><button id="connect">Connect ESP32</button> <span id="status">Disconnected</span><p><small>Select usbserial-0001 in the Chrome device picker. Close any other serial program first.</small></p></section><section><input id="file" type="file" accept="image/*"><canvas id="preview" width="128" height="64"></canvas><label>Brightness threshold <input id="threshold" type="range" min="0" max="255" value="128"></label><label><input id="invert" type="checkbox"> Invert pixels</label><button id="send" disabled>Send image to OLED</button></section><section><b>Device log</b><pre id="log">Ready.</pre></section><script>
const $=id=>document.getElementById(id), ctx=$('preview').getContext('2d',{willReadFrequently:true});let port,img,writer,reader,bytes,waiting=false;const log=s=>{$('log').textContent+='\n'+s;$('log').scrollTop=$('log').scrollHeight};function update(){$('send').disabled=!writer||!bytes||waiting}function render(){if(!img)return;ctx.fillStyle='black';ctx.fillRect(0,0,128,64);let scale=Math.min(128/img.width,64/img.height),w=Math.round(img.width*scale),h=Math.round(img.height*scale);ctx.drawImage(img,Math.floor((128-w)/2),Math.floor((64-h)/2),w,h);let d=ctx.getImageData(0,0,128,64);bytes=new Uint8Array(1024);for(let i=0;i<8192;i++){let j=i*4,v=.299*d.data[j]+.587*d.data[j+1]+.114*d.data[j+2],on=(v>=Number($('threshold').value))!==$('invert').checked;d.data[j]=d.data[j+1]=d.data[j+2]=on?255:0;if(on)bytes[i>>3]|=128>>(i&7)}ctx.putImageData(d,0,0);update()}
$('file').onchange=async()=>{try{img=await createImageBitmap($('file').files[0]);render()}catch(e){log(e.message)}};$('threshold').oninput=render;$('invert').onchange=render;
$('connect').onclick=async()=>{try{if(!navigator.serial)throw Error('Use Google Chrome or Edge on localhost.');$('connect').disabled=true;port=await navigator.serial.requestPort();await port.open({baudRate:115200});writer=port.writable.getWriter();reader=port.readable.getReader();$('status').textContent='Connected — initialising';(async()=>{let buffer='',decoder=new TextDecoder();try{while(true){let {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let lines=buffer.split('\n');buffer=lines.pop();for(let line of lines){line=line.trim();if(line)log(line);if(line==='DISPLAYED'){waiting=false;update();log('Receiver reported DISPLAYED; verify physical screen.')}}}}catch(e){log(e.message)}finally{reader.releaseLock();writer?.releaseLock();writer=null;try{await port.close()}catch{}$('status').textContent='Disconnected';$('connect').disabled=false;update()}})();await new Promise(r=>setTimeout(r,3000));$('status').textContent='Connected';update()}catch(e){log(e.message);$('connect').disabled=false}};
$('send').onclick=async()=>{waiting=true;update();try{let packet=new Uint8Array(1029);packet.set([79,76,69,68,64]);packet.set(bytes,5);await writer.write(packet);log('Sent 1024 pixel bytes.');setTimeout(()=>{if(waiting){waiting=false;update();log('No confirmation within 10 seconds.')}},10000)}catch(e){waiting=false;update();log(e.message)}};
</script></body></html>
