name: bike_app
description: "Bike Nav: handlebar navigation and close-pass recording for the Design project bike."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  bike_navigation:
    path: ../navigation
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.15
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  http: ^1.6.0
  http_parser: ^4.1.2
  latlong2: ^0.10.1
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
